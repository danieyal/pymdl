[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymdl"
version = "0.1.0"
description = "Unofficial fully-typed sync + async Python client for the MyDramaList app API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pymdl contributors" }]
keywords = ["mydramalist", "mdl", "drama", "kdrama", "api", "client", "async", "curl_cffi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "curl_cffi>=0.7",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "unasync>=0.5",
    # httpx + respx are test-only: the transport is client-agnostic and the suite injects
    # an httpx client so respx can mock the network (curl_cffi is not respx-interceptable).
    "httpx>=0.24",
    "respx>=0.20",
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "mypy>=1.5",
]
docs = [
    "mkdocs-material>=9",
]

[project.urls]
Homepage = "https://github.com/danieyal/pymdl"
Documentation = "https://github.com/danieyal/pymdl#readme"
Source = "https://github.com/danieyal/pymdl"

[tool.hatch.build.targets.wheel]
packages = ["src/mdl"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
# UP is intentionally omitted: the library targets Python 3.9 and keeps typing.Optional /
# typing.Union in annotations rather than PEP 604 syntax.
select = ["E", "F", "I", "B", "W"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Generated by unasync from _async — not hand-edited.
"src/mdl/_sync/**" = ["E501"]

[tool.mypy]
# mypy's analysis target (>=3.10); the package itself still supports 3.9 at runtime.
python_version = "3.10"
strict = true
files = ["src/mdl"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
include = ["src"]
